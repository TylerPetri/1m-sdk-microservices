groups:
  - name: sdkms.recording.latency
    interval: 30s
    rules:
      # HTTP latency (gateway) by route
      - record: job:http_server_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (job, le, http_method) (rate(http_server_duration_seconds_bucket[5m])))
      - record: job:http_server_request_duration_seconds:p99
        expr: histogram_quantile(0.99, sum by (job, le, http_method) (rate(http_server_duration_seconds_bucket[5m])))

      # gRPC latency by service/method
      - record: job:grpc_server_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (job, le, rpc_method) (rate(rpc_server_duration_seconds_bucket[5m])))
      - record: job:grpc_server_request_duration_seconds:p99
        expr: histogram_quantile(0.99, sum by (job, le, rpc_method) (rate(rpc_server_duration_seconds_bucket[5m])))

  - name: sdkms.recording.errors
    interval: 30s
    rules:
      # Error rates (best-effort; depends on instrumentation labels)
      - record: job:http_server_requests:rate5m
        expr: sum by (job, http_method, http_status_code) (rate(http_server_duration_seconds_count[5m]))
      - record: job:grpc_server_requests:rate5m
        expr: sum by (job, rpc_method, rpc_code) (rate(rpc_server_duration_seconds_count[5m]))
